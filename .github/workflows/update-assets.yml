name: Update Profile SVGs Nightly

on:
  schedule:
    # Runs daily at 22:30 UTC / 11:30 PM WAT (Abia State, Nigeria time)
    # Off-the-hour schedules run much more reliably on GitHub Actions
    - cron: '30 22 * * *'
  workflow_dispatch: # Lets you click "Run workflow" to force an update anytime

permissions:
  contents: write # Needed so the token can push files back to your profile repo

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Latest ASCII SVGs
        run: |
          # Fetch the clean vector code directly from your gh.crafter.run generator string
          curl -fL "https://gh.crafter.run/VeloraTech?theme=dark" -o dark_mode.svg
          curl -fL "https://gh.crafter.run/VeloraTech?theme=light" -o light_mode.svg

      - name: Commit and Push Updates
        run: |
          # Setup standard GitHub runner bot identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Force overwrite the local repo workspace assets
          git add dark_mode.svg light_mode.svg
          
          # Only create a commit if your GitHub statistics (stars/repos) actually changed
          if git diff-index --quiet HEAD --; then
            echo "No stats modifications found today. Skipping commit."
          else
            git commit -m "chore: nightly automated profile ASCII card update"
            git push
          fi
